[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nvd_mcp_server"]

[project]
name = "nvd-mcp-server"
version = "0.1.0"
description = "MCP server for the NIST National Vulnerability Database (NVD)"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Mohammed Ali Zubair", email = "mazg1493@gmail.com"},
]
keywords = ["mcp", "nvd", "cve", "security", "vulnerability", "nist"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Internet",
]
dependencies = [
    "fastmcp>=2.10.5",
    "aiohttp>=3.12.14",
    "pydantic-settings>=2.10.1",
]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/Alig1493/nvd-mcp-server"
Repository = "https://github.com/Alig1493/nvd-mcp-server"
Issues = "https://github.com/Alig1493/nvd-mcp-server/issues"

[project.scripts]
nvd-mcp-server = "nvd_mcp_server.main:main"

[dependency-groups]
dev = [
    "ipdb",
    "pre-commit>=4.2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.12.4",
    "mypy>=1.17.0",
    "coverage>=7.10.2",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
