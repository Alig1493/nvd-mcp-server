[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nvd_mcp_server"]

[project]
name = "nvd-mcp-server"
version = "0.1.0"
description = "MCP server for the NIST National Vulnerability Database (NVD)"
authors = [
    {name = "Mohammed Ali Zubair", email = "mazg1493@gmail.com"},
]
dependencies = [
    "fastmcp",
    "aiohttp",
    "uvicorn>=0.30.0",
    "pydantic-settings",
]
requires-python = ">=3.11"

[project.scripts]
nvd-mcp-server = "nvd_mcp_server.cli:main"

[tool.uv]
dev-dependencies = [
    "ipdb",
    "pre-commit>=4.2.0",
    "ruff>=0.12.4",
    "mypy>=1.17.0",
    "coverage>=7.10.2",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
