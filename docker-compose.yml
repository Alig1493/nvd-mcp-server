services:
  nvd-mcp-server:
    build: .
    ports:
      - "8000:8000"
    environment:
      NVD_API_KEY: ${NVD_API_KEY}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/sse"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
