services:
  nvd-mcp-server:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Required so the Python code doesn't raise an unhandled initialization exception
      - NVD_API_KEY=${NVD_API_KEY}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
