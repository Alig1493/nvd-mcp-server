name: NVD API Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 8am UTC — catches NVD API changes

env:
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

jobs:
  test:
    name: Run end-to-end NVD API tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Run integration tests
        run: uv run src/scripts/test_cve_api.py

  test-http:
    name: Run http connection test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Create .env file
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }} # Maps repository secret to step env
        run: |
          echo "NVD_API_KEY=${NVD_API_KEY}" > .env

      - name: Build and start Docker container
        run: docker compose up --build -d

      - name: Wait for server to be healthy
        run: |
          echo "Waiting for HTTP server..."
          for i in $(seq 1 30); do
            if nc -z localhost 8000 2>/dev/null; then
              echo "Server is up on port 8000."
              exit 0
            fi
            echo "  attempt $i/30 — retrying in 2s"
            sleep 2
          done
          echo "Server did not become healthy in time."
          docker compose logs
          exit 1
      
      - name: Debug server logs
        run: docker compose logs nvd-mcp-server

      - name: Run HTTP connection test
        run: uv run src/scripts/test_sse_connection.py

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
