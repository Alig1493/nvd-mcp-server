name: NVD API Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 8am UTC — catches NVD API changes

env:
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

jobs:
  test:
    name: Run end-to-end NVD API tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Run integration tests
        run: uv run src/scripts/test_cve_api.py

  test-http:
    name: Run http connection test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Create .env file
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }} # Maps repository secret to step env
        run: |
          echo "NVD_API_KEY=${NVD_API_KEY}" > .env

      - name: Build and start Docker container
        run: docker compose up --build -d

      - name: Wait for server to be healthy
        run: |
          echo "Waiting for HTTP server to process application routing..."
          for i in $(seq 1 30); do
            # 1. Verify the port is physically open first
            if nc -z localhost 8000 2>/dev/null; then
              # 2. Verify the application layer is responding to the protocol endpoint
              # -s (silent), -o /dev/null (discard output), -w "%{http_code}" (extract status)
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/mcp || echo "000")
              
              # FastMCP returns a 200, 400, or 405 depending on methods, but anything except 000/404 means the route exists
              if [ "$HTTP_STATUS" != "000" ] && [ "$HTTP_STATUS" != "404" ]; then
                echo "Server is up and application routing is live (HTTP $HTTP_STATUS)."
                exit 0
              fi
              echo "  Port 8000 is open, but application layer is still initializing..."
            fi
            echo "  attempt $i/30 — retrying in 2s"
            sleep 2
          done
          echo "Server application did not become healthy in time."
          docker compose logs
          exit 1
      
      - name: Debug server logs
        run: docker compose logs nvd-mcp-server

      - name: Run HTTP connection test
        run: uv run src/scripts/test_http_connection.py

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
